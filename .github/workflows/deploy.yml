# Menerbitkan HALAMAN PUBLIK (masuk, pemulihan sandi, kanal pengaduan warga)
# sebagai berkas statis ke GitHub Pages -- pratinjau untuk tim dan dinas.
#
# Aplikasi tetap berupa Laravel biasa. Alur ini menjalankannya sebentar di
# runner, menggilas `php artisan sim:tautan-statis` (14 URL publik) menjadi
# HTML, lalu menerbitkan hasilnya. Sejak Tahap 3, seluruh halaman internal
# ber-`auth` -- tidak ikut digilas (`DaftarTautanStatis` menyaringnya).
#
# PEMICU OTOMATIS `push` DICABUT 2026-09-04: penerbitan hanya lewat
# `workflow_dispatch` manual. Penghentian penuh + pindah ke hosting ber-PHP =
# Task 11.3 (`agents/tasklist.md`). Konteks: `agents/notes.md` bagian 1b.7.

name: Terbitkan ke GitHub Pages

on:
  workflow_dispatch:

# Hanya satu penerbitan berjalan pada satu waktu. Penerbitan yang sedang
# berlangsung dibiarkan selesai agar situs tidak terbit setengah jadi.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  bangun:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Siapkan PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, bcmath, zip, gd, pdo_sqlite
          coverage: none

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Pasang dependensi PHP
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Pasang dependensi Node
        run: npm ci

      - name: Bangun aset
        run: |
          npm run build
          # Berkas penanda server pengembangan Vite. Bila ikut terbawa, @vite
          # mengalihkan seluruh aset ke localhost:5173 dan situs terbit tanpa
          # gaya sama sekali. Runner mestinya bersih, tetapi penghapusan ini
          # menjaga bila berkasnya sempat ikut ter-commit.
          rm -f public/hot

      - name: Siapkan lingkungan
        env:
          # Alamat akhir situs, dibaca config/app.php lewat kunci asset_url.
          # AppServiceProvider lalu menyamakan akar seluruh tautan dengannya.
          # Tanpa ini setiap tautan dan gambar kehilangan awalan /transmigrasi.
          ASSET_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cp .env.example .env
          php artisan key:generate --force
          # Basis data hanya diperlukan agar kerangka Laravel dapat menyala.
          # Tahap 2 belum membaca satu tabel pun; seluruh isi halaman berasal
          # dari app/Support/DummyData.php.
          touch database/database.sqlite
          {
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            echo "APP_URL=${ASSET_URL}"
            echo "ASSET_URL=${ASSET_URL}"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=$(pwd)/database/database.sqlite"
            echo "SESSION_DRIVER=file"
            echo "CACHE_STORE=file"
            echo "QUEUE_CONNECTION=sync"
          } >> .env
          php artisan migrate --force

      - name: Kumpulkan daftar alamat
        run: |
          php artisan sim:tautan-statis > alamat-mentah.txt

          # Menyaring baris yang BUKAN alamat, dan menghentikan proses bila ada.
          #
          # Artisan menulis ke stdout yang sama dengan daftar alamat, sehingga
          # satu peringatan PHP atau pesan deprecation ikut terbawa ke berkas
          # ini. Baris semacam itu lalu dirangkai menjadi URL dan membuat curl
          # gagal dengan kode 3 (URL malformed), yang membunuh langkah
          # penggilasan sebelum satu halaman pun diperiksa.
          #
          # Kejadian nyata: penerbitan 2026-08-19 gagal dengan "exit code 3"
          # tanpa satu pun baris GAGAL tercetak, sebab kegagalannya terjadi
          # pada perintah, bukan pada hasil pemeriksaan.
          grep -E '^/[A-Za-z0-9/_.~-]*$' alamat-mentah.txt > alamat.txt || true

          jumlah_mentah=$(wc -l < alamat-mentah.txt)
          jumlah_bersih=$(wc -l < alamat.txt)

          if [ "$jumlah_mentah" != "$jumlah_bersih" ]; then
            echo "::error::Keluaran sim:tautan-statis memuat baris yang bukan alamat."
            echo "Baris yang ditolak:"
            grep -vE '^/[A-Za-z0-9/_.~-]*$' alamat-mentah.txt || true
            exit 1
          fi

          if [ "$jumlah_bersih" -eq 0 ]; then
            echo "::error::Daftar alamat kosong."
            exit 1
          fi

          echo "Jumlah halaman yang akan digilas: ${jumlah_bersih}"

      - name: Jalankan server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          # Menunggu sampai server benar-benar menjawab, bukan menebak dengan
          # jeda tetap yang bisa terlalu cepat pada runner yang sibuk.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/; then
              echo "Server siap setelah ${i} detik."
              exit 0
            fi
            sleep 1
          done
          echo "Server tidak kunjung siap."
          exit 1

      - name: Gilas menjadi berkas statis
        run: |
          mkdir -p keluaran
          gagal=0
          daftar_gagal=""

          # Menonaktifkan `-e` untuk blok ini.
          #
          # Langkah ini dijalankan dengan `bash -e`, sehingga perintah gagal
          # menghentikan skrip SEKETIKA beserta kode keluar milik perintah itu.
          # Akibatnya penghitung `gagal` di bawah tidak pernah terpakai dan
          # ringkasan yang sudah disiapkan tidak pernah tercetak: kegagalan
          # yang seharusnya terbaca jelas malah muncul sebagai angka telanjang.
          #
          # Kini setiap kegagalan dicatat dan penggilasan diteruskan, agar satu
          # laporan memuat SELURUH halaman bermasalah, bukan hanya yang pertama.
          set +e

          while read -r alamat; do
            [ -z "$alamat" ] && continue

            # Setiap halaman menjadi folder berisi index.html, sehingga alamat
            # tetap bersih tanpa akhiran .html dan sama persis dengan versi
            # yang dilayani Laravel.
            if [ "$alamat" = "/" ]; then
              tujuan="keluaran/index.html"
            else
              if ! mkdir -p "keluaran${alamat}"; then
                echo "GAGAL mkdir ${alamat}"
                daftar_gagal="${daftar_gagal}  mkdir gagal: ${alamat}"$'\n'
                gagal=$((gagal + 1))
                continue
              fi
              tujuan="keluaran${alamat}/index.html"
            fi

            kode=$(curl -s -o "$tujuan" -w '%{http_code}' "http://127.0.0.1:8000${alamat}")
            galat_curl=$?

            if [ "$galat_curl" -ne 0 ]; then
              echo "GAGAL curl(${galat_curl}) ${alamat}"
              daftar_gagal="${daftar_gagal}  curl galat ${galat_curl}: ${alamat}"$'\n'
              gagal=$((gagal + 1))
              continue
            fi

            if [ "$kode" != "200" ]; then
              echo "GAGAL ${kode} ${alamat}"
              daftar_gagal="${daftar_gagal}  HTTP ${kode}: ${alamat}"$'\n'
              gagal=$((gagal + 1))
            fi
          done < alamat.txt

          set -e

          if [ "$gagal" -gt 0 ]; then
            echo "::error::Ada ${gagal} halaman gagal digilas. Penerbitan dihentikan."
            echo "Rincian:"
            printf '%s' "$daftar_gagal"
            exit 1
          fi

          echo "Seluruh halaman berhasil digilas."

      - name: Pastikan setiap alamat menghasilkan berkas
        run: |
          # Penjaga terhadap kegagalan yang TIDAK memerahkan langkah di atas.
          #
          # `curl` membalas 200 sekaligus menulis berkas, tetapi berkas kosong
          # atau folder yang gagal terbentuk tidak selalu tertangkap kode HTTP.
          # Kekeliruan semacam itu baru muncul sebagai 404 di tangan pengguna,
          # persis yang terjadi pada halaman rincian SP (notes.md 1b.6a).
          kurang=0

          while read -r alamat; do
            [ -z "$alamat" ] && continue

            if [ "$alamat" = "/" ]; then
              berkas="keluaran/index.html"
            else
              berkas="keluaran${alamat}/index.html"
            fi

            if [ ! -s "$berkas" ]; then
              echo "TIDAK ADA ATAU KOSONG: ${berkas}"
              kurang=$((kurang + 1))
            fi
          done < alamat.txt

          if [ "$kurang" -gt 0 ]; then
            echo "::error::${kurang} alamat tidak menghasilkan berkas. Penerbitan dihentikan."
            exit 1
          fi

          echo "Seluruh $(wc -l < alamat.txt) alamat menghasilkan berkas."

      - name: Salin aset statis
        run: |
          cp -r public/build keluaran/build
          cp -r public/images keluaran/images
          cp public/favicon.ico keluaran/favicon.ico
          # Menonaktifkan Jekyll agar folder dan berkas berawalan garis bawah
          # tidak dibuang diam-diam oleh GitHub Pages.
          touch keluaran/.nojekyll

      - name: Sediakan halaman 404
        run: |
          # GitHub Pages memakai berkas ini untuk alamat yang tidak dikenal,
          # sehingga pengunjung tetap melihat tampilan galat milik sistem.
          curl -s -o keluaran/404.html http://127.0.0.1:8000/alamat-yang-tidak-ada || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: keluaran

  terbitkan:
    needs: bangun
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.penerbitan.outputs.page_url }}

    steps:
      - id: penerbitan
        uses: actions/deploy-pages@v4
